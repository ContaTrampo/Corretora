<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap">
<style>
:root{--ink:#1c1d21;--char:#3a3b3f;--teal:#2aa8c8;--td:#0b6f8e;--red:#e04b3f;--paper:#f3f5f7;--line:#dfe3e8;--mute:#565c64;--bg:#fff;--on:#1c1d21;--pad:clamp(20px,5vw,56px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#fff}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{font:400 1.0625rem/1.65 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
ul,ol{list-style:none;padding:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:10px 16px;z-index:99}.skip:focus{left:8px}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--pad)}
section{padding:clamp(72px,10vw,136px) 0}
.k{font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--td);display:flex;align-items:center;gap:12px;margin-bottom:22px}
.k:before{content:"";width:32px;height:3px;background:var(--red)}
h1,h2,h3{font-weight:800;letter-spacing:-.03em;line-height:1.04}
h1{font-size:clamp(2.6rem,6.2vw,5rem)}
h2{font-size:clamp(2.1rem,4.8vw,3.9rem);max-width:15ch}
h3{font-size:1.3rem;letter-spacing:-.015em;line-height:1.2}
.lead{font-size:clamp(1.1rem,1.6vw,1.3rem);color:var(--mute);max-width:56ch;margin-top:24px}
.dk{background:var(--ink);color:#fff}.dk .lead,.dk .m{color:#c7ccd2}.dk .k{color:var(--teal)}
.pp{background:var(--paper)}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:14px 26px;font:800 .98rem Manrope,system-ui,sans-serif;text-decoration:none;border:2px solid var(--td);background:var(--td);color:#fff;border-radius:4px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn i{font-style:normal;transition:transform .2s}.btn:hover i{transform:translateX(5px)}
.btn:hover{background:var(--ink);border-color:var(--ink)}
.btn.o{background:transparent;color:var(--ink);border-color:var(--ink)}.btn.o:hover{background:var(--ink);color:#fff}
.dk .btn,.ct .btn{background:#fff;color:var(--ink);border-color:#fff}.dk .btn:hover,.ct .btn:hover{background:var(--teal);border-color:var(--teal)}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
/* header */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
.logo img{height:54px;width:auto}.hl{height:96px;width:auto;margin-bottom:36px}
nav ul{display:flex;gap:clamp(14px,2.2vw,30px)}
nav a{text-decoration:none;font-weight:600;font-size:.94rem;padding:8px 2px;border-bottom:2px solid transparent}nav a:hover{border-color:var(--teal)}
.hb .btn{min-height:44px;padding:10px 18px;font-size:.9rem}
.mb{display:none;width:48px;height:48px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}
.mb span{display:block;width:22px;height:2px;background:var(--ink);margin:5px auto;transition:transform .2s,opacity .2s}
.mb[aria-expanded=true] span:nth-child(1){transform:translateY(7px) rotate(45deg)}.mb[aria-expanded=true] span:nth-child(2){opacity:0}.mb[aria-expanded=true] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
#pg{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--teal);transform:scaleX(0);transform-origin:0 50%}
/* hero */
.hero{padding:clamp(40px,6vw,88px) 0 clamp(64px,8vw,112px);overflow:hidden}
.hg{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,80px);align-items:center}
.hero h1 em{font-style:normal;color:var(--td)}
.hero .tags{margin-top:44px;display:flex;flex-wrap:wrap;gap:8px 28px;font-weight:600;font-size:.92rem;color:var(--mute)}
.hero .tags span:before{content:"";display:inline-block;width:8px;height:8px;background:var(--red);margin-right:10px}
.stage{perspective:1400px;position:relative;padding:0 0 60px 40px}
.tilt{transform-style:preserve-3d;transition:transform .25s ease-out;transform:rotateY(-5deg) rotateX(2deg)}
.ph{position:relative;border:1px solid var(--line);background:var(--paper)}
.ph img{width:100%;object-fit:cover}
.hm{aspect-ratio:456/490}.hm img{height:100%}
.hf{position:absolute;left:-4px;bottom:0;width:58%;border:8px solid #fff;transform:translateZ(60px)}
.hf img{aspect-ratio:3/2}
.fr{position:absolute;right:-16px;top:-16px;width:60%;height:60%;border:3px solid var(--teal);z-index:-1}
.cap{position:absolute;right:0;bottom:12px;background:var(--ink);color:#fff;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;transform:translateZ(80px)}
/* trust */
.tr{display:grid;grid-template-columns:repeat(3,1fr);margin-top:56px;border-top:3px solid var(--ink)}
.tr>div{padding:28px 28px 0 0}.tr>div+div{padding-left:28px;border-left:1px solid var(--line)}
.tr p{margin-top:12px;color:var(--mute)}
/* seguros */
.sg{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(20px,3vw,40px);margin-top:56px;align-items:start}
.sg article{display:flex;flex-direction:column;gap:22px}
.sg article:nth-child(2){margin-top:clamp(0px,7vw,96px)}
.sg .ph img{aspect-ratio:4/3}
.sg h3{font-size:clamp(1.6rem,2.6vw,2.2rem)}.sg p{color:var(--mute)}
.sg .ph{transition:transform .3s}.sg article:hover .ph{transform:translateY(-6px)}
/* detalhes */
.dg{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(32px,6vw,96px);align-items:start}
.dg>div:first-child{position:sticky;top:110px}
.price{display:flex;flex-direction:column;border-left:4px solid var(--red);padding:4px 0 4px 22px;margin-top:32px}
.price b{font-size:clamp(2rem,4.4vw,3.2rem);letter-spacing:-.03em;line-height:1.05}.price span{font-size:.92rem;color:var(--mute);margin-top:8px;max-width:38ch}
.dk .price span{color:#c7ccd2}
.bl{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.bl section,.bl>div{padding:26px 0;border-top:1px solid var(--line)}
.dk .bl>div{border-color:#44464c}
.bl h3{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--td);margin-bottom:14px}.dk .bl h3{color:var(--teal)}
.bl li{padding:5px 0 5px 20px;position:relative}.bl li:before{content:"";position:absolute;left:0;top:.82em;width:8px;height:2px;background:var(--red)}
.bl .w{grid-column:1/-1}
.note{font-size:.9rem;color:var(--mute);margin-top:12px}.dk .note{color:#aeb4bb}
.ops{font-weight:600;font-size:1.08rem;line-height:1.8}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:28px;border-top:1px solid #44464c}
.vals p{padding:18px 16px 0 0;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
/* como */
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:56px;counter-reset:s}
.st li{counter-increment:s;padding:0 28px 0 0;position:relative}
.st li:before{content:counter(s,decimal-leading-zero);display:block;font-weight:800;font-size:3.4rem;letter-spacing:-.04em;line-height:1;color:var(--teal);border-bottom:3px solid var(--ink);padding-bottom:18px;margin-bottom:20px}
.st p{color:var(--mute);margin-top:8px}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px)}
.ab p+p{margin-top:18px}
/* faq */
.fq{max-width:860px;margin-top:48px;border-top:3px solid var(--ink)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:24px 0;font-weight:800;font-size:1.12rem;letter-spacing:-.01em;min-height:64px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:1.8rem;font-weight:500;line-height:1;color:var(--td);transition:transform .25s}
details[open] summary:after{transform:rotate(45deg)}
details p{padding:0 48px 26px 0;color:var(--mute);max-width:68ch}
/* contato */
.ct{background:var(--td);color:#fff}.ct .k{color:#fff}.ct .k:before{background:#fff}.ct .lead{color:#e3f2f7}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px);margin-top:48px;align-items:start}
.cl{border-top:2px solid #fff}
.cl h3{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;margin:22px 0 4px}
.ci{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #4d9bb3;flex-wrap:wrap}
.ci b{display:block;font-size:1.1rem}.ci span{font-size:1.02rem;color:#e3f2f7}
.ci .btn{min-height:46px;padding:10px 18px;font-size:.9rem}
form{background:#fff;color:var(--ink);padding:clamp(24px,3vw,40px);border-radius:4px}
form h3{margin-bottom:6px}form>p{color:var(--mute);font-size:.95rem;margin-bottom:22px}
label{display:block;font-weight:800;font-size:.88rem;margin:16px 0 6px}
input,select{width:100%;min-height:52px;padding:12px 14px;font:500 1rem Manrope,system-ui,sans-serif;border:2px solid #b9c0c8;border-radius:4px;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--td);outline:3px solid var(--teal);outline-offset:1px}
[aria-invalid=true]{border-color:var(--red)}
.er{color:#b42318;font-size:.85rem;font-weight:600;min-height:1.2em;margin-top:6px}
form .btn{width:100%;justify-content:center;margin-top:20px;background:var(--td);color:#fff;border-color:var(--td)}form .btn:hover{background:var(--ink);border-color:var(--ink)}
.ig{display:inline-block;margin-top:26px;font-weight:800;text-decoration:underline;text-underline-offset:5px}
/* footer */
footer{padding:64px 0 40px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px}
footer .logo img{height:56px}
footer h3{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--td);margin-bottom:14px}
footer li{padding:4px 0}footer a{text-decoration:none}footer a:hover{text-decoration:underline}
.fn{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);font-size:.85rem;color:var(--mute);max-width:90ch}
.stick{display:none}
/* motion */
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js .rv.in{opacity:1;transform:none}
.js .rv.d1{transition-delay:.1s}.js .rv.d2{transition-delay:.2s}.js .rv.d3{transition-delay:.3s}
@media(max-width:980px){
.mb{display:block}.hb>.btn{display:none}
nav{position:absolute;left:0;right:0;top:76px;background:#fff;border-bottom:1px solid var(--line);display:none}
nav.on{display:block}nav ul{flex-direction:column;gap:0;padding:8px var(--pad) 20px}nav a{display:block;padding:16px 0;font-size:1.1rem;border-bottom:1px solid var(--line)}
.hg,.dg,.ab,.cg,.sg{grid-template-columns:1fr}.dg>div:first-child{position:static}
.sg article:nth-child(2){margin-top:0}
.st{grid-template-columns:1fr 1fr;row-gap:44px}.fg{grid-template-columns:1fr 1fr}.fg>div:first-child{grid-column:1/-1}
.tr{grid-template-columns:1fr}.tr>div,.tr>div+div{padding:24px 0;border-left:0;border-bottom:1px solid var(--line)}
}
@media(max-width:640px){
body{font-size:1.05rem;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.bl,.vals{grid-template-columns:1fr}.st{grid-template-columns:1fr}.fg{grid-template-columns:1fr}
.stage{padding-left:16px}.hf{width:64%}
.row .btn{width:100%;justify-content:space-between}
.stick{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);transform:translateY(110%);transition:transform .3s}
.stick.on{transform:none}.stick .btn{width:100%;justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}.js .rv{opacity:1;transform:none}.tilt{transform:none}}
</style>
